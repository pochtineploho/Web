<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="POCHTINEPLOHO, одежда, магазин, мода, интернет-магазин, купить">
    <meta name="description" content="Профиль в интернет-магазине одежды POCHTINEPOLOHO.">
    <link rel="stylesheet" href="outlines.css">
    <title>Профиль - POCHTINEPOLOHO</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css">
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>
</head>

<body>
<header>
    <div class="header-nav">
        <div class="header-nav-left">
            <button class="gender-btn active" id="female-btn">Женское</button>
            <button class="gender-btn" id="male-btn">Мужское</button>
            <script src="scripts/gender-button-href.js"></script>

            <a href="search.html" class="search-link">
                <img src="icons/search.png" alt="Поиск" class="icon-search">
            </a>
        </div>

        <a href="main-page.html" class="logo">
            <img src="icons/POCHTINEPLOHO.png" alt="POCHTINEPOLOHO Логотип">
        </a>

        <div class="header-nav-right">
            <a href="account.html">
                <img src="icons/account.png" alt="Аккаунт" class="icon">
            </a>
            <a href="favorites.html">
                <img src="icons/favorites.png" alt="Избранное" class="icon">
            </a>
            <a href="shopping-cart.html">
                <img src="icons/cart.png" alt="Корзина" class="icon">
            </a>
        </div>
    </div>
</header>

<div class="main-container">
    <div class="auth-buttons">
        <button class="btn btn-lg btn-primary" data-bs-toggle="modal" data-bs-target="#authModal">Войти</button>
        <button class="btn btn-lg btn-secondary" id="registerButton">Регистрация</button>
    </div>
    <div class="cat-container">
        <a data-fancybox="gallery" data-caption="Honorable mention" href="images/cat.png">
            <img src="images/cat.png" alt="Котик" class="cat-image">
        </a>
        <p class="cat-caption">Honorable mention</p>
    </div>
</div>

<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="authModalLabel">Авторизация</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form id="authForm">
                    <div class="mb-3">
                        <label for="loginInput" class="form-label">Логин</label>
                        <input type="text" class="form-control" id="loginInput" placeholder="Введите логин">
                    </div>
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="passwordInput" placeholder="Введите пароль">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" id="submitAuth">Войти</button>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2024 POCHTINEPOLOHO. Почти все права защищены.</p>
</footer>

<script src="scripts/auth.js"></script>
<link rel="stylesheet" href="auth.css">
</body>
</html>
