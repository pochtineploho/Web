<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="POCHTINEPOLOHO, товар, одежда, мода">
    <meta name="description" content="Карточка товара на POCHTINEPOLOHO">
    <link rel="stylesheet" href="outlines.css">
    <link rel="stylesheet" href="products-page.css">
    <title>Карточка товара - POCHTINEPOLOHO</title>

    <script src="scripts/modal-image.js" defer></script>
    <script src="scripts/product-page.js"></script>
    <script src="scripts/gender-button-href.js" defer></script>
    <script src="scripts/like-button.js"></script>
    <script src="scripts/cart-button.js"></script>
</head>

<body>
<header>
    <div class="header-nav">
        <div class="header-nav-left" id="product-page-header-nav-left">
            <button class="gender-btn active" id="female-btn">Женское</button>
            <button class="gender-btn" id="male-btn">Мужское</button>
        </div>
        <a href="main-page.html" class="logo">
            <img src="icons/POCHTINEPLOHO.png" alt="POCHTINEPOLOHO Логотип">
        </a>
        <div class="header-nav-right">
            <a href="account.html"><img src="icons/account.png" alt="Аккаунт" class="icon"></a>
            <a href="favorites.html"><img src="icons/favorites.png" alt="Избранное" class="icon"></a>
            <a href="shopping-cart.html"><img src="icons/cart.png" alt="Корзина" class="icon"></a>
        </div>
    </div>
</header>

<main>
    <section class="product-card product-card__page">
        <div class="product-info product-info__page">
            <h1 class="product-name product-name__page"></h1>
            <p class="product-category__page"></p>
            <p class="product-description product-description__page"></p>

            <div class="product-page-buttons">
                <button class="product-page-add-to-cart-btn">Добавить в корзину</button>
            </div>
        </div>

        <div class="product-page-price-block">
            <p class="product-price product-price__page"></p>
        </div>

        <div class="product-page-images">
            <div class="product-page-main-image-container">
                <img src="" alt="" class="product-page-main-image" id="main-image">
                <button class="like-btn on-image">
                    <img src="icons/favorites2.png" alt="Добавить в избранное" class="like-icon">
                </button>
            </div>
            <div class="product-page-additional-images">
            </div>
        </div>
    </section>
</main>

<div id="image-modal" class="image-modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="full-image" alt="" src="">
</div>

<footer>
    <p>© 2024 POCHTINEPOLOHO. Почти все права защищены.</p>
    <p id="load-stats"></p>
    <script src="scripts/load-stats.js"></script>
</footer>

</body>
</html>
